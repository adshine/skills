name: Skill feedback
description: Share a result, usability issue, or improvement idea after testing an adshine skill.
title: "[Skill feedback]: "
labels:
  - feedback
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill tested
      options:
        - measured-visual-qa
        - full-stack-interaction-qa
        - Both together
        - Another skill
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent or tool
      description: For example, Codex, Claude Code, or another SKILL.md-compatible agent.
      placeholder: Codex
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What did you test?
      description: Describe the interface, interaction, or workflow you asked the skill to inspect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the useful output, unexpected behavior, or missing guidance.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add screenshots, recordings, logs, or a minimal reproduction. Remove private data first.
  - type: textarea
    id: improvement
    attributes:
      label: How could the skill improve?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, personal data, and private customer information from the evidence.
          required: true
